<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One year of us</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Nunito:wght@500;700;800&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="letter">
<div id="hearts" aria-hidden="true"></div>
<div id="prog" aria-hidden="true"></div>
<button id="mus" hidden aria-label="Toggle music">♪</button>
<main>
<section id="love" class="center">
  <h2>A video for you</h2><p class="sub" id="lsub">Tap the seal to open it.</p>
  <div id="stage">
    <div class="env3" id="env3">
      <div class="eb"></div>
      <div class="ef"></div>
      <div class="fl"></div>
      <button class="seal" id="seal" aria-label="Break the seal and open"></button>
    </div>
    <div id="vcard">
      <div class="vframe">
        <div id="vwrap">
          <button id="vplay" aria-label="Play the video"></button>
        </div>
        <span class="vcap" id="vcap"></span>
      </div>
    </div>
  </div>
  <div id="vafter"></div>
</section>
</main>
<footer><span class="hand" style="font-size:1.6rem" id="foot"></span></footer>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/letter.js"></script>
</body>
</html>
