<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One year of us</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Nunito:wght@500;700;800&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
<div id="hearts" aria-hidden="true"></div>
<div id="prog" aria-hidden="true"></div>
<button id="mus" hidden aria-label="Toggle music">♪</button>
<main>
<header id="hero">
  <div class="duo" aria-hidden="true"><img src="photos/december.jpg" alt=""><img src="photos/today.jpg" alt=""><img src="photos/m1.jpg" alt=""></div>
  <p class="hand" style="font-size:1.8rem;margin:0">for my favorite person</p>
  <h1><span id="her">Her Name</span><em>one year of us</em></h1>
  <div class="clock" aria-live="off">
    <div><b id="cD">0</b><span>days</span></div><div><b id="cH">0</b><span>hours</span></div>
    <div><b id="cM">0</b><span>minutes</span></div><div><b id="cS">0</b><span>seconds</span></div>
  </div>
  <p class="sub" style="margin:0">…and I’d pick you in every one of them.</p>
  <p class="hand" id="until" style="font-size:1.7rem;margin:.4rem 0 1rem"></p>
  <p><button id="go">Start the adventure</button></p>
</header>
</main>
<footer><span class="hand" style="font-size:1.6rem" id="foot"></span></footer>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/index.js"></script>
</body>
</html>
